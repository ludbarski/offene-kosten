<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offene Kosten</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #910c93;
            --primary-dark: #730a74;
            --bg: rgba(255,255,255,.97);
            --card: #ffffff;
            --text: #242124;
            --muted: #726b73;
            --border: #e7e2e8;
            --expense: #c0392b;
            --credit: #1f9d55;
            --income: #1f9d55;
            --sale: #8e44ad;
            --danger: #d84f4f;
            --info: #3b82f6;
            --success: #4caf50;
            --warning: #f44336;
            --shadow: 0 12px 36px rgba(0,0,0,.24);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            color: var(--text);
            background: #08070a url("hintergrund.jpg") center / cover fixed;
            padding:
                calc(env(safe-area-inset-top) + 10px)
                10px
                calc(env(safe-area-inset-bottom) + 92px);
        }

        button, input, textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* Anmeldung */

        #authScreen {
            width: 100%;
            max-width: 470px;
            margin: 5vh auto 0;
            padding: 25px 20px;
            border-radius: 26px;
            background: var(--bg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .auth-icon {
            display: grid;
            place-items: center;
            width: 62px;
            height: 62px;
            margin: 0 auto 14px;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 2rem;
        }

        #authScreen h1 {
            margin: 0;
            color: var(--primary);
            text-align: center;
            font-size: 1.6rem;
        }

        #authScreen p {
            margin: 9px 0 22px;
            color: var(--muted);
            text-align: center;
            line-height: 1.45;
        }

        .auth-message {
            min-height: 22px;
            margin-top: 12px;
            text-align: center;
            color: var(--danger);
            font-size: .92rem;
        }

        .auth-message.success {
            color: var(--success);
        }

        .auth-switch {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: .92rem;
        }

        .link-btn {
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--primary);
            font-size: inherit;
            font-weight: 800;
        }

        /* Haupt-App */

        #appShell {
            display: none;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 26px;
            background: var(--bg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 17px 16px 15px;
            background: var(--primary);
            color: white;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .header h1 {
            margin: 0 0 4px;
            font-size: 1.45rem;
        }

        .header p {
            margin: 0;
            opacity: .9;
            font-size: .9rem;
        }

        .header-actions {
            display: flex;
            gap: 7px;
        }

        .header-btn {
            min-height: 43px;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 13px;
            background: rgba(255,255,255,.16);
            color: white;
            font-size: .85rem;
            font-weight: 800;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 12px 10px;
            border-bottom: 1px solid var(--border);
            background: #faf7fb;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 0 0 auto;
            min-height: 49px;
            padding: 12px 16px;
            border: 0;
            border-radius: 16px;
            background: #efe8f0;
            color: #5a515c;
            font-size: .96rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .hint {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: #f8f8f8;
            color: var(--muted);
            text-align: center;
            font-size: .93rem;
            line-height: 1.4;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        .tool-btn {
            min-height: 48px;
            padding: 10px;
            border: 0;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            font-size: .91rem;
            font-weight: 800;
        }

        .tool-btn.secondary {
            background: #efe8f0;
            color: #5d4561;
        }

        .tool-note {
            padding: 0 14px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            color: #888;
            font-size: .8rem;
            line-height: 1.35;
        }

        .filters {
            display: flex;
            gap: 8px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        .filter-btn {
            flex: 1;
            min-height: 47px;
            border: 1px solid #ddd;
            border-radius: 14px;
            background: white;
            color: #444;
            font-weight: 800;
            font-size: .94rem;
        }

        .filter-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        .summary-card,
        .month-card,
        .balance-card {
            padding: 12px 14px;
            border: 1px solid #ececec;
            border-radius: 18px;
            background: #fafafa;
        }

        .summary-card.expense {
            border-color: #ffd9d4;
            background: #fff3f2;
        }

        .summary-card.credit,
        .summary-card.income {
            border-color: #d4f3df;
            background: #eefaf3;
        }

        .summary-card.sale {
            border-color: #ead6f5;
            background: #f7effb;
        }

        .balance-card {
            border-color: #eadbef;
            background: #f7f4f8;
        }

        .card-label {
            margin-bottom: 6px;
            color: var(--muted);
            font-size: .85rem;
            font-weight: 700;
        }

        .card-value {
            font-size: 1.12rem;
            font-weight: 900;
        }

        .expense {
            color: var(--expense);
        }

        .credit {
            color: var(--credit);
        }

        .income {
            color: var(--income);
        }

        .sale {
            color: var(--sale);
        }

        .card-sub {
            margin-top: 6px;
            color: #888;
            font-size: .77rem;
            line-height: 1.3;
        }

        .section-title {
            padding: 14px 14px 6px;
            color: #555;
            font-size: .96rem;
            font-weight: 900;
        }

        .month-cards {
            display: grid;
            gap: 10px;
            padding: 10px 14px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        .balance-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .balance-row input {
            flex: 1;
            min-width: 0;
        }

        .month-grid {
            display: grid;
            gap: 6px;
            margin-top: 8px;
        }

        .month-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: .92rem;
        }

        .month-empty {
            padding: 0 14px 14px;
            color: #888;
            font-size: .91rem;
        }

        .entries {
            min-height: 240px;
            padding: 14px;
        }

        .empty {
            padding: 38px 16px;
            color: #888;
            text-align: center;
        }

        .entry {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 14px;
            border-left: 5px solid var(--primary);
            border-radius: 18px;
            background: #f8f8f9;
        }

        .entry.completed {
            border-left-color: var(--success);
            background: #f1f7f2;
            opacity: .84;
        }

        .entry.completed .entry-title {
            color: #8d8d8d;
            text-decoration: line-through;
        }

        .entry.overdue {
            border-left-color: var(--warning);
            background: #fff0f0;
        }

        .entry-check {
            width: 24px;
            height: 24px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .entry-main {
            flex: 1;
            min-width: 0;
        }

        .entry-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .entry-title {
            font-size: 1.04rem;
            font-weight: 800;
            line-height: 1.35;
            word-break: break-word;
        }

        .entry-amount {
            flex-shrink: 0;
            white-space: nowrap;
            font-size: .98rem;
            font-weight: 900;
        }

        .entry-meta {
            margin-top: 6px;
            color: var(--muted);
            font-size: .92rem;
        }

        .entry-note {
            margin-top: 8px;
            color: #707070;
            font-size: .93rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .entry-source {
            margin-top: 8px;
            color: #8b8b8b;
            font-size: .83rem;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            margin-top: 8px;
            margin-right: 5px;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: .74rem;
            font-weight: 800;
        }

        .badge.open {
            background: #f8eefe;
            color: var(--primary);
        }

        .badge.done {
            background: #e6f5ea;
            color: #2e7d32;
        }

        .badge.expense {
            background: #fff0ee;
            color: var(--expense);
        }

        .badge.credit,
        .badge.income {
            background: #eaf8ee;
            color: var(--credit);
        }

        .badge.sale {
            background: #f3eafb;
            color: var(--sale);
        }

        .entry-actions {
            display: grid;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-btn {
            min-width: 43px;
            min-height: 40px;
            border: 0;
            border-radius: 12px;
            color: white;
            font-size: .9rem;
            font-weight: 800;
        }

        .action-edit {
            background: var(--info);
        }

        .action-delete {
            background: var(--danger);
        }

        .fab {
            position: fixed;
            right: 18px;
            bottom: calc(env(safe-area-inset-bottom) + 18px);
            z-index: 40;
            width: 62px;
            height: 62px;
            border: 0;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 26px rgba(145,12,147,.35);
            font-size: 2rem;
        }

        .overlay {
            display: none;
            position: fixed;
            z-index: 90;
            inset: 0;
            background: rgba(0,0,0,.48);
        }

        .overlay.open {
            display: block;
        }

        .sheet {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            max-width: 560px;
            margin: auto;
            padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px);
            border-radius: 24px 24px 0 0;
            background: white;
            box-shadow: 0 -10px 30px rgba(0,0,0,.2);
            transform: translateY(110%);
            transition: transform .22s ease;
        }

        .sheet.open {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 46px;
            height: 5px;
            margin: 0 auto 14px;
            border-radius: 999px;
            background: #ddd;
        }

        .sheet h2 {
            margin: 0 0 8px;
            color: var(--primary);
            font-size: 1.22rem;
        }

        .sheet-hint {
            margin: 0 0 13px;
            color: #777;
            font-size: .87rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: .95rem;
            font-weight: 800;
        }

        input, textarea {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d8d8d8;
            border-radius: 16px;
            background: white;
            color: var(--text);
            font-size: 1rem;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(145,12,147,.12);
        }

        .flow-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .flow-btn {
            min-height: 57px;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 900;
        }

        .flow-btn.expense {
            border-color: #ffd9d4;
            background: #fff3f2;
            color: var(--expense);
        }

        .flow-btn.credit {
            border-color: #d4f3df;
            background: #eefaf3;
            color: var(--credit);
        }

        .flow-btn.active.expense {
            border-color: var(--expense);
            background: var(--expense);
            color: white;
        }

        .flow-btn.active.credit {
            border-color: var(--credit);
            background: var(--credit);
            color: white;
        }

        .sheet-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-primary, .btn-secondary {
            flex: 1;
            min-height: 52px;
            border: 0;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #efefef;
            color: #333;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: rgba(20,17,24,.97);
                --card: #141118;
                --text: #f4eef8;
                --muted: #b8aac6;
                --border: #3a2f43;
            }

            body {
                background-color: #09070c;
            }

            .tabs,
            .hint,
            .toolbar,
            .tool-note,
            .filters,
            .summary-grid,
            .month-cards {
                border-color: var(--border);
                background: #141118;
            }

            .tab-btn {
                background: #241d2a;
                color: #ddd2e7;
            }

            .tool-btn.secondary {
                background: #2b2431;
                color: #eadff3;
            }

            .filter-btn {
                border-color: #4a3a55;
                background: #221c28;
                color: #ece3f3;
            }

            .summary-card,
            .month-card,
            .balance-card,
            .entry {
                border-color: #352a3d;
                background: #1b1620;
                color: var(--text);
            }

            .summary-card.expense {
                border-color: #653838;
                background: #2b1919;
            }

            .summary-card.credit,
            .summary-card.income {
                border-color: #2d5d42;
                background: #15261c;
            }

            .summary-card.sale {
                border-color: #5a3f6d;
                background: #24182d;
            }

            .balance-card {
                border-color: #4c3a58;
                background: #201827;
            }

            .entry.completed {
                background: #1a241d;
            }

            .entry.overdue {
                background: #2a1818;
            }

            .sheet {
                background: #19141e;
            }

            .form-group label {
                color: #ddd1e8;
            }

            input, textarea {
                border-color: #473750;
                background: #17121c;
                color: #f4eef8;
            }

            input::placeholder, textarea::placeholder {
                color: #8f7fa1;
            }

            .btn-secondary {
                background: #2a2430;
                color: #f1e9f6;
            }

            .entry-meta,
            .entry-note,
            .entry-source,
            .tool-note,
            .hint,
            .auth-switch,
            #authScreen p {
                color: #b8aac6;
            }

            .flow-btn.expense {
                border-color: #7a3c3c;
                background: #341b1b;
                color: #ffb9af;
            }

            .flow-btn.credit {
                border-color: #2f6a49;
                background: #173021;
                color: #a6e8c4;
            }
        }
    </style>
</head>

<body>

    <!-- Anmeldung -->
    <section id="authScreen">
        <div class="auth-icon">💶</div>
        <h1 id="authTitle">Offene Kosten</h1>
        <p id="authIntro">Melde dich an, damit deine Daten auf allen Geräten synchron bleiben.</p>

        <div class="form-group">
            <label for="authEmail">E-Mail-Adresse</label>
            <input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@beispiel.de">
        </div>

        <div class="form-group">
            <label for="authPassword">Passwort</label>
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="Mindestens 8 Zeichen">
        </div>

        <button class="btn-primary" id="authSubmit" onclick="handleAuth()">Anmelden</button>

        <div class="auth-switch">
            <span id="authSwitchText">Noch kein Konto?</span>
            <button class="link-btn" id="authSwitchBtn" onclick="toggleAuthMode()">Registrieren</button>
        </div>

        <div id="authMessage" class="auth-message"></div>
    </section>

    <!-- Haupt-App -->
    <main id="appShell">
        <div class="header">
            <div class="header-row">
                <div>
                    <h1>💶 Offene Kosten</h1>
                    <p id="syncStatus">Daten werden geladen …</p>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="exportToPDF()">PDF</button>
                    <button class="header-btn" onclick="signOut()">Abmelden</button>
                </div>
            </div>
        </div>

        <div class="tabs" id="tabs"></div>
        <div id="content"></div>
    </main>

    <button class="fab hidden" id="fabBtn" onclick="openCreateSheet()">+</button>

    <input id="backupInput" class="hidden" type="file" accept=".json,application/json" onchange="handleBackupImport(event)">

    <div class="overlay" id="overlay" onclick="closeSheet()"></div>

    <section class="sheet" id="entrySheet">
        <div class="sheet-handle"></div>
        <h2 id="sheetTitle">Neuer Eintrag</h2>
        <p class="sheet-hint" id="sheetHint"></p>

        <div class="form-group hidden" id="flowGroup">
            <label>Art</label>
            <div class="flow-toggle">
                <button type="button" class="flow-btn expense active" id="expenseBtn" onclick="setFlow('expense')">Belastung</button>
                <button type="button" class="flow-btn credit" id="creditBtn" onclick="setFlow('credit')">Gutschrift</button>
            </div>
        </div>

        <div class="form-group">
            <label for="entryTitle">Bezeichnung</label>
            <input id="entryTitle" type="text" placeholder="z. B. Monatsrate, Rückzahlung, Ebay-Verkauf">
        </div>

        <div class="form-group">
            <label for="entryAmount">Betrag in Euro</label>
            <input id="entryAmount" type="text" inputmode="decimal" placeholder="z. B. 49,90">
        </div>

        <div class="form-group">
            <label for="entryDate">Fällig am</label>
            <input id="entryDate" type="date">
        </div>

        <div class="form-group">
            <label for="entryNote">Notiz (optional)</label>
            <textarea id="entryNote" placeholder="z. B. Bestellnummer, Ansprechpartner, Plattform …"></textarea>
        </div>

        <div class="sheet-actions">
            <button class="btn-secondary" onclick="closeSheet()">Abbrechen</button>
            <button class="btn-primary" id="saveEntryBtn" onclick="saveEntry()">Speichern</button>
        </div>
    </section>

    <script>
        /* ============================================================
           HIER DEINE SUPABASE-WERTE EINFÜGEN
           ============================================================ */

        const SUPABASE_URL = "https://guhugeusbbusknuixuxy.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QhP4TFOvspuVa1s_w5EpUA_1m0vXGdn";

        /* Beispiel:
        const SUPABASE_URL = "https://abcxyzabcdef.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_xxxxxxxxxxxxxxxxx";
        */

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const REGISTERS = [
            { id: 0, name: "Alle", kind: "all" },
            { id: 1, name: "Amazon Rate", kind: "mixed" },
            { id: 2, name: "Paypal Rate", kind: "mixed" },
            { id: 3, name: "Kreditkarte", kind: "mixed" },
            { id: 4, name: "Außenstände", kind: "income" },
            { id: 5, name: "Offene Verkäufe", kind: "sale" }
        ];

        let user = null;
        let entries = [];
        let accountBalance = null;
        let currentTab = 0;
        let filter = "all";
        let authMode = "login";
        let currentFlow = "expense";
        let editId = null;

        function todayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        function esc(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatEuro(value) {
            return new Intl.NumberFormat("de-DE", {
                style: "currency",
                currency: "EUR"
            }).format(Number(value || 0));
        }

        function parseEuro(value) {
            if (!value || !String(value).trim()) return null;

            let text = String(value)
                .trim()
                .replace(/\s/g, "")
                .replace(/€/g, "");

            if (text.includes(",") && text.includes(".")) {
                if (text.lastIndexOf(",") > text.lastIndexOf(".")) {
                    text = text.replace(/\./g, "").replace(",", ".");
                } else {
                    text = text.replace(/,/g, "");
                }
            } else if (text.includes(",")) {
                text = text.replace(/\./g, "").replace(",", ".");
            }

            const number = Number(text);
            return Number.isFinite(number) ? Number(number.toFixed(2)) : null;
        }

        function formatDate(dateString) {
            return new Date(dateString + "T00:00:00").toLocaleDateString("de-DE", {
                weekday: "short",
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            });
        }

        function monthName(key) {
            const [year, month] = key.split("-");
            return new Date(Number(year), Number(month) - 1, 1).toLocaleDateString("de-DE", {
                month: "long",
                year: "numeric"
            });
        }

        function getMonthKey(date) {
            return String(date).slice(0, 7);
        }

        function overdue(entry) {
            if (entry.completed) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return new Date(entry.due_date + "T00:00:00") < today;
        }

        function flowLabel(flow) {
            return {
                expense: "Belastung",
                credit: "Gutschrift",
                income: "Einnahme",
                sale: "Verkauf"
            }[flow] || "";
        }

        function setStatus(text) {
            document.getElementById("syncStatus").textContent = text;
        }

        /* Anmeldung */

        function authMessage(text = "", success = false) {
            const element = document.getElementById("authMessage");
            element.textContent = text;
            element.classList.toggle("success", success);
        }

        function toggleAuthMode() {
            authMode = authMode === "login" ? "signup" : "login";

            document.getElementById("authTitle").textContent =
                authMode === "login" ? "Offene Kosten" : "Konto erstellen";

            document.getElementById("authIntro").textContent =
                authMode === "login"
                    ? "Melde dich an, damit deine Daten auf allen Geräten synchron bleiben."
                    : "Erstelle dein persönliches Konto für die zentrale Synchronisation.";

            document.getElementById("authSubmit").textContent =
                authMode === "login" ? "Anmelden" : "Konto erstellen";

            document.getElementById("authSwitchText").textContent =
                authMode === "login" ? "Noch kein Konto?" : "Schon registriert?";

            document.getElementById("authSwitchBtn").textContent =
                authMode === "login" ? "Registrieren" : "Anmelden";

            authMessage();
        }

        async function handleAuth() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value;
            const button = document.getElementById("authSubmit");

            if (!email || !password) {
                authMessage("Bitte E-Mail-Adresse und Passwort eingeben.");
                return;
            }

            if (password.length < 8) {
                authMessage("Das Passwort muss mindestens 8 Zeichen haben.");
                return;
            }

            button.disabled = true;
            button.textContent = authMode === "login" ? "Anmeldung läuft …" : "Konto wird erstellt …";

            try {
                if (authMode === "signup") {
                    const { data, error } = await db.auth.signUp({ email, password });
                    if (error) throw error;

                    if (!data.session) {
                        authMessage("Konto erstellt. Bitte prüfe gegebenenfalls dein E-Mail-Postfach.", true);
                    }
                } else {
                    const { error } = await db.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
            } catch (error) {
                authMessage(error.message || "Anmeldung nicht möglich.");
            } finally {
                button.disabled = false;
                button.textContent = authMode === "login" ? "Anmelden" : "Konto erstellen";
            }
        }

        async function signOut() {
            if (!confirm("Wirklich abmelden?")) return;
            await db.auth.signOut();
        }

        /* Cloud laden und speichern */

        async function loadData() {
            if (!user) return;

            setStatus("Synchronisiere …");

            try {
                const [entriesResult, settingsResult] = await Promise.all([
                    db.from("cost_entries")
                        .select("*")
                        .order("due_date", { ascending: true }),

                    db.from("cost_settings")
                        .select("*")
                        .maybeSingle()
                ]);

                if (entriesResult.error) throw entriesResult.error;
                if (settingsResult.error) throw settingsResult.error;

                entries = entriesResult.data || [];
                accountBalance = settingsResult.data?.current_account_balance === null ||
                                 settingsResult.data?.current_account_balance === undefined
                    ? null
                    : Number(settingsResult.data.current_account_balance);

                render();

                const time = new Date().toLocaleTimeString("de-DE", {
                    hour: "2-digit",
                    minute: "2-digit"
                });

                setStatus(`Synchronisiert · ${time}`);
            } catch (error) {
                console.error(error);
                setStatus("Synchronisation fehlgeschlagen");
                alert("Cloud-Daten konnten nicht geladen werden.\n\n" + (error.message || ""));
            }
        }

        async function saveBalance() {
            const input = document.getElementById("balanceInput");
            const value = parseEuro(input.value);

            if (input.value.trim() && value === null) {
                alert("Bitte einen gültigen Kontostand eingeben.");
                return;
            }

            try {
                const { error } = await db
                    .from("cost_settings")
                    .upsert({
                        user_id: user.id,
                        current_account_balance: value,
                        updated_at: new Date().toISOString()
                    }, { onConflict: "user_id" });

                if (error) throw error;

                accountBalance = value;
                render();
                setStatus("Kontostand gespeichert");
            } catch (error) {
                alert("Kontostand konnte nicht gespeichert werden.\n\n" + (error.message || ""));
            }
        }

        /* Einträge */

        function setFlow(flow) {
            currentFlow = flow;
            document.getElementById("expenseBtn").classList.toggle("active", flow === "expense");
            document.getElementById("creditBtn").classList.toggle("active", flow === "credit");
        }

        function openCreateSheet() {
            if (currentTab === 0) return;

            const register = REGISTERS[currentTab];
            editId = null;

            document.getElementById("sheetTitle").textContent = `Neuer Eintrag – ${register.name}`;
            document.getElementById("entryTitle").value = "";
            document.getElementById("entryAmount").value = "";
            document.getElementById("entryDate").value = todayString();
            document.getElementById("entryNote").value = "";
            document.getElementById("saveEntryBtn").textContent = "Speichern";

            document.getElementById("flowGroup").classList.toggle("hidden", register.kind !== "mixed");
            setFlow("expense");

            document.getElementById("sheetHint").textContent =
                register.kind === "mixed"
                    ? "Standard ist Belastung. Für Rückerstattungen bitte Gutschrift auswählen."
                    : register.kind === "sale"
                        ? "Betrag ist optional. Nur Einträge mit Betrag werden summiert."
                        : "Betrag und Fälligkeitsdatum eingeben.";

            openSheet();
        }

        function openEditSheet(id) {
            const entry = entries.find(item => item.id === id);
            if (!entry) return;

            const register = REGISTERS[entry.register];
            editId = id;

            document.getElementById("sheetTitle").textContent = `Eintrag bearbeiten – ${register.name}`;
            document.getElementById("entryTitle").value = entry.title || "";
            document.getElementById("entryAmount").value =
                entry.amount !== null ? String(entry.amount).replace(".", ",") : "";
            document.getElementById("entryDate").value = entry.due_date;
            document.getElementById("entryNote").value = entry.note || "";
            document.getElementById("saveEntryBtn").textContent = "Änderungen speichern";

            document.getElementById("flowGroup").classList.toggle("hidden", register.kind !== "mixed");
            setFlow(entry.flow === "credit" ? "credit" : "expense");

            document.getElementById("sheetHint").textContent =
                register.kind === "mixed"
                    ? "Belastung oder Gutschrift kann geändert werden."
                    : "Eintrag wird zentral aktualisiert.";

            openSheet();
        }

        function openSheet() {
            document.getElementById("overlay").classList.add("open");
            document.getElementById("entrySheet").classList.add("open");

            setTimeout(() => document.getElementById("entryTitle").focus(), 120);
        }

        function closeSheet() {
            document.getElementById("overlay").classList.remove("open");
            document.getElementById("entrySheet").classList.remove("open");
        }

        async function saveEntry() {
            const register = currentTab;
            const registerInfo = REGISTERS[register];
            const title = document.getElementById("entryTitle").value.trim();
            const amountRaw = document.getElementById("entryAmount").value.trim();
            const amount = parseEuro(amountRaw);
            const dueDate = document.getElementById("entryDate").value;
            const note = document.getElementById("entryNote").value.trim();
            const button = document.getElementById("saveEntryBtn");

            let flow = "expense";
            if (registerInfo.kind === "mixed") flow = currentFlow;
            if (registerInfo.kind === "income") flow = "income";
            if (registerInfo.kind === "sale") flow = "sale";

            if (!title) {
                alert("Bitte eine Bezeichnung eintragen.");
                return;
            }

            if (!dueDate) {
                alert("Bitte ein Fälligkeitsdatum eintragen.");
                return;
            }

            if (amountRaw && amount === null) {
                alert("Bitte einen gültigen Betrag eingeben, z. B. 49,90.");
                return;
            }

            if (registerInfo.kind !== "sale" && amount === null) {
                alert("Bitte einen Betrag eingeben.");
                return;
            }

            button.disabled = true;
            button.textContent = "Speichert …";

            const payload = {
                register,
                title,
                amount,
                due_date: dueDate,
                note: note || null,
                flow,
                updated_at: new Date().toISOString()
            };

            try {
                let result;

                if (editId) {
                    result = await db
                        .from("cost_entries")
                        .update(payload)
                        .eq("id", editId)
                        .select()
                        .single();
                } else {
                    result = await db
                        .from("cost_entries")
                        .insert({
                            ...payload,
                            completed: false
                        })
                        .select()
                        .single();
                }

                if (result.error) throw result.error;

                closeSheet();
                await loadData();
            } catch (error) {
                alert("Eintrag konnte nicht gespeichert werden.\n\n" + (error.message || ""));
            } finally {
                button.disabled = false;
                button.textContent = editId ? "Änderungen speichern" : "Speichern";
            }
        }

        async function toggleCompleted(id) {
            const entry = entries.find(item => item.id === id);
            if (!entry) return;

            try {
                const { error } = await db
                    .from("cost_entries")
                    .update({
                        completed: !entry.completed,
                        updated_at: new Date().toISOString()
                    })
                    .eq("id", id);

                if (error) throw error;

                await loadData();
            } catch (error) {
                alert("Status konnte nicht geändert werden.\n\n" + (error.message || ""));
            }
        }

        async function deleteEntry(id) {
            if (!confirm("Eintrag wirklich löschen?")) return;

            try {
                const { error } = await db
                    .from("cost_entries")
                    .delete()
                    .eq("id", id);

                if (error) throw error;

                await loadData();
            } catch (error) {
                alert("Eintrag konnte nicht gelöscht werden.\n\n" + (error.message || ""));
            }
        }

        /* Berechnungen */

        function filteredEntries(register) {
            let list = register === 0
                ? entries.filter(entry => entry.register >= 1 && entry.register <= 4)
                : entries.filter(entry => entry.register === register);

            if (filter === "pending") list = list.filter(entry => !entry.completed);
            if (filter === "completed") list = list.filter(entry => entry.completed);

            return [...list].sort((a, b) => {
                if (a.completed !== b.completed) return Number(a.completed) - Number(b.completed);
                return new Date(a.due_date) - new Date(b.due_date);
            });
        }

        function allTotals() {
            const total = {
                expenseOpen: 0,
                expenseDone: 0,
                creditOpen: 0,
                creditDone: 0,
                incomeOpen: 0,
                incomeDone: 0
            };

            entries
                .filter(entry => entry.register >= 1 && entry.register <= 4)
                .forEach(entry => {
                    if (entry.amount === null) return;

                    if (entry.flow === "expense") {
                        entry.completed ? total.expenseDone += Number(entry.amount) : total.expenseOpen += Number(entry.amount);
                    }

                    if (entry.flow === "credit") {
                        entry.completed ? total.creditDone += Number(entry.amount) : total.creditOpen += Number(entry.amount);
                    }

                    if (entry.flow === "income") {
                        entry.completed ? total.incomeDone += Number(entry.amount) : total.incomeOpen += Number(entry.amount);
                    }
                });

            return total;
        }

        function simpleTotals(register) {
            let open = 0;
            let done = 0;

            entries
                .filter(entry => entry.register === register)
                .forEach(entry => {
                    if (entry.amount === null) return;
                    entry.completed ? done += Number(entry.amount) : open += Number(entry.amount);
                });

            return { open, done };
        }

        function mixedTotals(register) {
            const total = {
                expenseOpen: 0,
                expenseDone: 0,
                creditOpen: 0,
                creditDone: 0
            };

            entries
                .filter(entry => entry.register === register)
                .forEach(entry => {
                    if (entry.amount === null) return;

                    if (entry.flow === "expense") {
                        entry.completed ? total.expenseDone += Number(entry.amount) : total.expenseOpen += Number(entry.amount);
                    }

                    if (entry.flow === "credit") {
                        entry.completed ? total.creditDone += Number(entry.amount) : total.creditOpen += Number(entry.amount);
                    }
                });

            return total;
        }

        function monthData(register) {
            const map = {};

            const relevant = register === 0
                ? entries.filter(entry => entry.register >= 1 && entry.register <= 4)
                : entries.filter(entry => entry.register === register);

            relevant.forEach(entry => {
                if (entry.amount === null) return;

                const key = getMonthKey(entry.due_date);

                if (!map[key]) {
                    map[key] = {
                        expenseOpen: 0,
                        expenseDone: 0,
                        creditOpen: 0,
                        creditDone: 0,
                        incomeOpen: 0,
                        incomeDone: 0,
                        open: 0,
                        done: 0
                    };
                }

                const amount = Number(entry.amount);

                if (register === 0) {
                    if (entry.flow === "expense") {
                        entry.completed ? map[key].expenseDone += amount : map[key].expenseOpen += amount;
                    }

                    if (entry.flow === "credit") {
                        entry.completed ? map[key].creditDone += amount : map[key].creditOpen += amount;
                    }

                    if (entry.flow === "income") {
                        entry.completed ? map[key].incomeDone += amount : map[key].incomeOpen += amount;
                    }
                } else if (REGISTERS[register].kind === "mixed") {
                    if (entry.flow === "expense") {
                        entry.completed ? map[key].expenseDone += amount : map[key].expenseOpen += amount;
                    }

                    if (entry.flow === "credit") {
                        entry.completed ? map[key].creditDone += amount : map[key].creditOpen += amount;
                    }
                } else {
                    entry.completed ? map[key].done += amount : map[key].open += amount;
                }
            });

            return Object.entries(map).sort((a, b) => b[0].localeCompare(a[0]));
        }

        /* Darstellung */

        function renderTabs() {
            document.getElementById("tabs").innerHTML = REGISTERS.map(item => `
                <button class="tab-btn ${item.id === currentTab ? "active" : ""}"
                        onclick="switchTab(${item.id})">
                    ${item.name}
                </button>
            `).join("");
        }

        function switchTab(register) {
            currentTab = register;
            filter = "all";
            render();
        }

        function renderSummary(register) {
            if (register === 0) {
                const total = allTotals();

                return `
                    <div class="summary-grid">
                        <div class="summary-card expense"><div class="card-label">Ausgaben offen</div><div class="card-value expense">${formatEuro(total.expenseOpen)}</div></div>
                        <div class="summary-card expense"><div class="card-label">Ausgaben erledigt</div><div class="card-value expense">${formatEuro(total.expenseDone)}</div></div>
                        <div class="summary-card credit"><div class="card-label">Gutschriften offen</div><div class="card-value credit">${formatEuro(total.creditOpen)}</div></div>
                        <div class="summary-card credit"><div class="card-label">Gutschriften erledigt</div><div class="card-value credit">${formatEuro(total.creditDone)}</div></div>
                        <div class="summary-card income"><div class="card-label">Einnahmen offen</div><div class="card-value income">${formatEuro(total.incomeOpen)}</div><div class="card-sub">Nur Außenstände</div></div>
                        <div class="summary-card income"><div class="card-label">Einnahmen erledigt</div><div class="card-value income">${formatEuro(total.incomeDone)}</div><div class="card-sub">Nur Außenstände</div></div>
                    </div>
                `;
            }

            const info = REGISTERS[register];

            if (info.kind === "mixed") {
                const total = mixedTotals(register);

                return `
                    <div class="summary-grid">
                        <div class="summary-card expense"><div class="card-label">Belastung offen</div><div class="card-value expense">${formatEuro(total.expenseOpen)}</div></div>
                        <div class="summary-card expense"><div class="card-label">Belastung erledigt</div><div class="card-value expense">${formatEuro(total.expenseDone)}</div></div>
                        <div class="summary-card credit"><div class="card-label">Gutschrift offen</div><div class="card-value credit">${formatEuro(total.creditOpen)}</div></div>
                        <div class="summary-card credit"><div class="card-label">Gutschrift erledigt</div><div class="card-value credit">${formatEuro(total.creditDone)}</div></div>
                    </div>
                `;
            }

            const total = simpleTotals(register);
            const className = info.kind === "income" ? "income" : "sale";
            const note = info.kind === "sale"
                ? "Nur Einträge mit Betrag werden summiert."
                : "Summen enthalten offene und erledigte Einträge.";

            return `
                <div class="summary-grid">
                    <div class="summary-card ${className}">
                        <div class="card-label">Summe offen</div>
                        <div class="card-value ${className}">${formatEuro(total.open)}</div>
                        <div class="card-sub">${note}</div>
                    </div>
                    <div class="summary-card ${className}">
                        <div class="card-label">Summe erledigt</div>
                        <div class="card-value ${className}">${formatEuro(total.done)}</div>
                        <div class="card-sub">Erledigte Einträge bleiben sichtbar.</div>
                    </div>
                </div>
            `;
        }

        function renderMonths(register) {
            const months = monthData(register);

            let html = `<div class="section-title">Monatsübersicht</div><div class="month-cards">`;

            if (register === 0) {
                html += `
                    <div class="balance-card">
                        <div class="card-label">Aktueller Kontostand</div>
                        <div class="card-value" style="color:var(--primary);margin-bottom:10px;">
                            ${accountBalance === null ? "nicht gesetzt" : formatEuro(accountBalance)}
                        </div>
                        <div class="balance-row">
                            <input id="balanceInput" type="text" inputmode="decimal"
                                   placeholder="z. B. 1245,50"
                                   value="${accountBalance === null ? "" : String(accountBalance).replace(".", ",")}">
                            <button class="tool-btn" style="min-height:46px;" onclick="saveBalance()">Speichern</button>
                        </div>
                        <div class="card-sub">Nur zur Anzeige. Fließt nicht in Berechnungen ein.</div>
                    </div>
                `;
            }

            if (!months.length) {
                html += `<div class="month-empty">Noch keine Monatssummen vorhanden.</div></div>`;
                return html;
            }

            months.forEach(([key, values]) => {
                let rows = "";

                if (register === 0) {
                    rows = `
                        <div class="month-row"><span>Ausgaben offen</span><strong class="expense">${formatEuro(values.expenseOpen)}</strong></div>
                        <div class="month-row"><span>Ausgaben erledigt</span><strong class="expense">${formatEuro(values.expenseDone)}</strong></div>
                        <div class="month-row"><span>Gutschriften offen</span><strong class="credit">${formatEuro(values.creditOpen)}</strong></div>
                        <div class="month-row"><span>Gutschriften erledigt</span><strong class="credit">${formatEuro(values.creditDone)}</strong></div>
                        <div class="month-row"><span>Einnahmen offen</span><strong class="income">${formatEuro(values.incomeOpen)}</strong></div>
                        <div class="month-row"><span>Einnahmen erledigt</span><strong class="income">${formatEuro(values.incomeDone)}</strong></div>
                    `;
                } else if (REGISTERS[register].kind === "mixed") {
                    rows = `
                        <div class="month-row"><span>Belastung offen</span><strong class="expense">${formatEuro(values.expenseOpen)}</strong></div>
                        <div class="month-row"><span>Belastung erledigt</span><strong class="expense">${formatEuro(values.expenseDone)}</strong></div>
                        <div class="month-row"><span>Gutschrift offen</span><strong class="credit">${formatEuro(values.creditOpen)}</strong></div>
                        <div class="month-row"><span>Gutschrift erledigt</span><strong class="credit">${formatEuro(values.creditDone)}</strong></div>
                    `;
                } else {
                    const color = REGISTERS[register].kind === "income" ? "income" : "sale";
                    rows = `
                        <div class="month-row"><span>Offen</span><strong class="${color}">${formatEuro(values.open)}</strong></div>
                        <div class="month-row"><span>Erledigt</span><strong class="${color}">${formatEuro(values.done)}</strong></div>
                    `;
                }

                html += `
                    <div class="month-card">
                        <div class="card-label">${monthName(key)}</div>
                        <div class="month-grid">${rows}</div>
                    </div>
                `;
            });

            return html + `</div>`;
        }

        function renderEntry(entry, showSource = false) {
            const amount = entry.amount === null
                ? `<span class="entry-amount sale">ohne Betrag</span>`
                : `<span class="entry-amount ${entry.flow}">${formatEuro(entry.amount)}</span>`;

            return `
                <div class="entry ${entry.completed ? "completed" : ""} ${overdue(entry) ? "overdue" : ""}">
                    <input class="entry-check" type="checkbox" ${entry.completed ? "checked" : ""}
                           onchange="toggleCompleted('${entry.id}')">

                    <div class="entry-main">
                        <div class="entry-top">
                            <div class="entry-title">${esc(entry.title)}</div>
                            ${amount}
                        </div>

                        <div class="entry-meta">
                            ${formatDate(entry.due_date)}
                            ${overdue(entry) ? " • ⚠️ Überfällig" : ""}
                        </div>

                        ${entry.note ? `<div class="entry-note">${esc(entry.note)}</div>` : ""}

                        <div>
                            <span class="badge ${entry.completed ? "done" : "open"}">${entry.completed ? "Erledigt" : "Offen"}</span>
                            <span class="badge ${entry.flow}">${flowLabel(entry.flow)}</span>
                        </div>

                        ${showSource ? `<div class="entry-source">📂 ${REGISTERS[entry.register].name}</div>` : ""}
                    </div>

                    <div class="entry-actions">
                        <button class="action-btn action-edit" onclick="openEditSheet('${entry.id}')">✏️</button>
                        <button class="action-btn action-delete" onclick="deleteEntry('${entry.id}')">🗑️</button>
                    </div>
                </div>
            `;
        }

        function renderEntries(register) {
            const list = filteredEntries(register);

            if (!list.length) {
                return `<div class="entries"><div class="empty">Keine Einträge</div></div>`;
            }

            return `<div class="entries">${list.map(item => renderEntry(item, register === 0)).join("")}</div>`;
        }

        function render() {
            renderTabs();

            const info = REGISTERS[currentTab];
            const showFab = currentTab !== 0;

            document.getElementById("fabBtn").classList.toggle("hidden", !showFab);

            const topTools = currentTab === 0 ? `
                <div class="hint">
                    Gesamtübersicht ohne „Offene Verkäufe“. Gutschriften werden separat ausgewiesen.
                </div>

                <div class="toolbar">
                    <button class="tool-btn" onclick="importLocalIphoneData()">Lokale iPhone-Daten importieren</button>
                    <button class="tool-btn secondary" onclick="exportBackup()">Backup sichern</button>
                </div>

                <div class="toolbar" style="padding-top:0;">
                    <button class="tool-btn secondary" onclick="triggerBackupImport()">Backup laden</button>
                    <button class="tool-btn secondary" onclick="loadData()">Jetzt synchronisieren</button>
                </div>

                <div class="tool-note">
                    Den lokalen Import nur einmal auf dem iPhone mit deinem führenden Datenbestand ausführen.
                </div>
            ` : "";

            document.getElementById("content").innerHTML = `
                <section class="tab-content active">
                    ${topTools}

                    <div class="filters">
                        <button class="filter-btn ${filter === "all" ? "active" : ""}" onclick="setFilter('all')">Alle</button>
                        <button class="filter-btn ${filter === "pending" ? "active" : ""}" onclick="setFilter('pending')">Offen</button>
                        <button class="filter-btn ${filter === "completed" ? "active" : ""}" onclick="setFilter('completed')">Erledigt</button>
                    </div>

                    ${renderSummary(currentTab)}
                    ${renderMonths(currentTab)}
                    ${renderEntries(currentTab)}
                </section>
            `;
        }

        function setFilter(newFilter) {
            filter = newFilter;
            render();
        }

        /* Backup */

        function backupPayload() {
            return {
                app: "offene-kosten-cloud",
                version: 2,
                exportedAt: new Date().toISOString(),
                accountBalance,
                entries
            };
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function exportBackup() {
            const content = JSON.stringify(backupPayload(), null, 2);
            const filename = `offene-kosten-backup-${todayString()}.json`;
            const file = new File([content], filename, { type: "application/json" });

            try {
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: "Backup Offene Kosten",
                        text: "Backup der Kosten-App",
                        files: [file]
                    });
                    return;
                }
            } catch (error) {
                if (error.name === "AbortError") return;
            }

            downloadFile(content, filename);
        }

        function triggerBackupImport() {
            const input = document.getElementById("backupInput");
            input.value = "";
            input.click();
        }

        async function handleBackupImport(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            if (!confirm("Backup wirklich laden? Der aktuelle Cloud-Datenstand wird ersetzt.")) {
                return;
            }

            try {
                const backup = JSON.parse(await file.text());

                if (!backup || !Array.isArray(backup.entries)) {
                    throw new Error("Ungültiges Backup.");
                }

                const { error: deleteError } = await db
                    .from("cost_entries")
                    .delete()
                    .neq("id", "00000000-0000-0000-0000-000000000000");

                if (deleteError) throw deleteError;

                const rows = backup.entries.map(entry => ({
                    register: entry.register,
                    title: entry.title,
                    amount: entry.amount,
                    due_date: entry.due_date || entry.date,
                    note: entry.note || null,
                    flow: entry.flow,
                    completed: Boolean(entry.completed)
                }));

                if (rows.length) {
                    const { error: insertError } = await db
                        .from("cost_entries")
                        .insert(rows);

                    if (insertError) throw insertError;
                }

                const { error: balanceError } = await db
                    .from("cost_settings")
                    .upsert({
                        user_id: user.id,
                        current_account_balance: backup.accountBalance ?? null,
                        updated_at: new Date().toISOString()
                    }, { onConflict: "user_id" });

                if (balanceError) throw balanceError;

                await loadData();
                alert("Backup erfolgreich geladen.");
            } catch (error) {
                alert("Backup konnte nicht geladen werden.\n\n" + (error.message || ""));
            }
        }

        /* Einmaliger lokaler iPhone-Import */

        async function importLocalIphoneData() {
            if (!confirm(
                "Lokale Daten dieses iPhones in die Cloud übertragen?\n\n" +
                "Bitte nur auf dem iPhone mit deinem führenden Datenbestand ausführen.\n\n" +
                "Bestehende Cloud-Einträge bleiben dabei erhalten."
            )) return;

            try {
                const localRows = [];

                for (let register = 1; register <= 5; register++) {
                    const raw = localStorage.getItem(`costEntries${register}`);
                    if (!raw) continue;

                    let localEntries;

                    try {
                        localEntries = JSON.parse(raw);
                    } catch {
                        continue;
                    }

                    localEntries.forEach(entry => {
                        let flow = entry.flow;

                        if (!flow) {
                            if (register <= 3) flow = "expense";
                            if (register === 4) flow = "income";
                            if (register === 5) flow = "sale";
                        }

                        localRows.push({
                            register,
                            title: entry.title || "",
                            amount: entry.amount === null || entry.amount === undefined ? null : Number(entry.amount),
                            due_date: entry.date,
                            note: entry.note || null,
                            flow,
                            completed: Boolean(entry.completed)
                        });
                    });
                }

                const localBalanceRaw = localStorage.getItem("currentAccountBalance");
                const localBalance = localBalanceRaw ? Number(localBalanceRaw) : null;

                if (!localRows.length && localBalance === null) {
                    alert("Auf diesem Gerät wurden keine lokalen Kosten-Daten gefunden.");
                    return;
                }

                if (localRows.length) {
                    const { error } = await db
                        .from("cost_entries")
                        .insert(localRows);

                    if (error) throw error;
                }

                if (localBalance !== null) {
                    const { error } = await db
                        .from("cost_settings")
                        .upsert({
                            user_id: user.id,
                            current_account_balance: localBalance,
                            updated_at: new Date().toISOString()
                        }, { onConflict: "user_id" });

                    if (error) throw error;
                }

                await loadData();
                alert(`${localRows.length} lokale Einträge wurden in die Cloud übertragen.`);
            } catch (error) {
                alert("Lokale Daten konnten nicht übertragen werden.\n\n" + (error.message || ""));
            }
        }

        /* PDF */

        function exportToPDF() {
            const total = allTotals();

            let html = `
                <style>
                    @page { size: A4; margin: 10mm; }
                    body { font-family: Arial, sans-serif; color: #222; font-size: 11px; }
                    h1 { color: #910c93; text-align: center; }
                    h2 { color: #910c93; border-bottom: 2px solid #910c93; padding-bottom: 5px; page-break-after: avoid; }
                    .section { margin-bottom: 18px; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
                    th, td { border: 1px solid #ddd; padding: 7px; vertical-align: top; }
                    th { background: #f5f5f5; text-align: left; }
                    td.num { text-align: right; white-space: nowrap; }
                    tr { page-break-inside: avoid; }
                    thead { display: table-header-group; }
                </style>

                <h1>💶 Offene Kosten</h1>
                <p style="text-align:center;color:#666;">Erstellt am ${new Date().toLocaleDateString("de-DE")}</p>

                <div class="section">
                    <h2>Gesamtübersicht</h2>
                    <table>
                        <tr><th>Bereich</th><th class="num">Betrag</th></tr>
                        <tr><td>Aktueller Kontostand</td><td class="num">${accountBalance === null ? "nicht gesetzt" : formatEuro(accountBalance)}</td></tr>
                        <tr><td>Ausgaben offen</td><td class="num">${formatEuro(total.expenseOpen)}</td></tr>
                        <tr><td>Ausgaben erledigt</td><td class="num">${formatEuro(total.expenseDone)}</td></tr>
                        <tr><td>Gutschriften offen</td><td class="num">${formatEuro(total.creditOpen)}</td></tr>
                        <tr><td>Gutschriften erledigt</td><td class="num">${formatEuro(total.creditDone)}</td></tr>
                        <tr><td>Einnahmen offen</td><td class="num">${formatEuro(total.incomeOpen)}</td></tr>
                        <tr><td>Einnahmen erledigt</td><td class="num">${formatEuro(total.incomeDone)}</td></tr>
                    </table>
                </div>
            `;

            for (let register = 1; register <= 5; register++) {
                const info = REGISTERS[register];
                const list = entries
                    .filter(entry => entry.register === register)
                    .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

                html += `<div class="section"><h2>${info.name}</h2>`;

                if (!list.length) {
                    html += `<p>Keine Einträge vorhanden.</p></div>`;
                    continue;
                }

                html += `
                    <table>
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Art</th>
                                <th>Fällig</th>
                                <th>Bezeichnung</th>
                                <th class="num">Betrag</th>
                                <th>Notiz</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                list.forEach(entry => {
                    html += `
                        <tr>
                            <td>${entry.completed ? "Erledigt" : "Offen"}</td>
                            <td>${flowLabel(entry.flow)}</td>
                            <td>${formatDate(entry.due_date)}</td>
                            <td>${esc(entry.title)}</td>
                            <td class="num">${entry.amount === null ? "—" : formatEuro(entry.amount)}</td>
                            <td>${entry.note ? esc(entry.note) : "—"}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
            }

            html2pdf().set({
                margin: [8, 8, 8, 8],
                filename: `Offene-Kosten-${todayString()}.pdf`,
                image: { type: "jpeg", quality: 0.98 },
                html2canvas: { scale: 1.5, useCORS: true },
                jsPDF: { orientation: "portrait", unit: "mm", format: "a4" },
                pagebreak: { mode: ["css", "legacy"] }
            }).from(html).save();
        }

        /* Start und Synchronisation */

        async function applySession(session) {
            user = session?.user || null;

            if (!user) {
                document.getElementById("authScreen").style.display = "block";
                document.getElementById("appShell").style.display = "none";
                document.getElementById("fabBtn").classList.add("hidden");
                return;
            }

            document.getElementById("authScreen").style.display = "none";
            document.getElementById("appShell").style.display = "block";

            await loadData();
        }

        db.auth.onAuthStateChange((_event, session) => {
            applySession(session);
        });

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && user) {
                loadData();
            }
        });

        window.addEventListener("focus", () => {
            if (user) loadData();
        });

        setInterval(() => {
            if (user && !document.hidden) loadData();
        }, 30000);

        (async function init() {
            const { data } = await db.auth.getSession();
            await applySession(data.session);
        })();
    </script>
</body>
</html>
